[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "youtubarr-relay"
version = "0.1.0"
description = "Session-owning internal relay for Dispatcharr custom streams"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Jeremy Wolff"}]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
]

[project.scripts]
youtubarr-relay = "youtubarr_relay.main:main"
youtubarr-streamlink-resolver = "youtubarr_relay.streamlink_resolver:main"
youtubarr-ytdlp-resolver = "youtubarr_relay.ytdlp_resolver:main"

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/youtubarr_relay"]
